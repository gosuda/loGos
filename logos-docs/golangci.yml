# golangci-lint v2 config for the G2 lint gate; run it on new packages only with golangci-lint 2.15.0.
#
# Invocation (existing lint surface, AGENTS.md): from src/cmd with the fork's
# bin first on PATH:
#   golangci-lint run --config ../../logos-docs/golangci.yml ./go/internal/logos/...
# `logos lint` is a separate, native surface: it runs the 21 in-compiler rules
# in src/cmd/compile/internal/logos/lint on .go and .lgo at original source
# positions. This file does not route through `logos lint`, and `logos lint`
# does not invoke golangci-lint.
#
# Scope: .go only, for every linter enabled below. golangci-lint loads code
# through go/packages, which sees only .go files, so no enabled linter can
# report a .lgo position. Per-linter .lgo verdict:
#   - errcheck, govet (incl. nilness), ineffassign, staticcheck (incl.
#     SA2001, SA4006, SA4016, SA5007), unused, unparam: .go only; the SSA/IR
#     passes (nilness, SA4006, SA5007, unused, unparam) are additionally
#     blocked on .lgo until the M9/M21 lowered-path vet mapper lands.
#   - errorlint, unconvert, noctx, intrange, misspell, copyloopvar,
#     gocheckcompilerdirectives, gochecknoinits, nolintlint: .go only via
#     this config; an AST port to the native runner is feasible for each,
#     but none is registered there, so .lgo coverage comes only from the
#     native rules (e.g. slop::discarded_error, slop::err_chain_reset).
# .lgo files are therefore excluded from this config's scope by
# construction (they are never loaded), not by a path exclusion below.
version: "2"

linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - errorlint
    - gocheckcompilerdirectives
    - gochecknoinits
    - govet
    - ineffassign
    - intrange
    - misspell
    - noctx
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused

  settings:
    errorlint:
      errorf: false # Deduplicate against native slop::err_chain_reset.
      asserts: false
      comparison: true
    govet:
      enable:
        - nilness
      disable:
        - shadow
    misspell:
      locale: US
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1008
        - -SA5011

  exclusions:
    rules:
      # The five named init files of the logos packages: registration-path
      # init in context.go, ownedconstant.go, wasmloader.go, eject/eject.go,
      # and next/next.go is exempt from gochecknoinits.
      - path: (context|ownedconstant|wasmloader|eject|next)\.go
        linters:
          - gochecknoinits
